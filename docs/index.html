<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF Bird Alerts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SF Birds">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --blue: #1e6fd9; --red: #d93025; --new: #7c3aed; --ink: #1c1c1e; --muted: #6b6b70; --line: #e5e5ea;
          --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; font-family: -apple-system, system-ui, sans-serif; color: var(--ink);
               -webkit-tap-highlight-color: transparent; overscroll-behavior: none; background: #f2f2f7; }
  #map { position: fixed; inset: 0; }
  button, select, input { font: inherit; color: inherit; }
  /* iOS zooms the page when a focused input is under 16px */
  input[type=search], select { font-size: 16px; }

  /* ---- top status pill ---- */
  .status { position: fixed; z-index: 1000; top: calc(var(--sat) + 10px); left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted);
            box-shadow: 0 1px 6px rgba(0,0,0,.18); white-space: nowrap; max-width: calc(100vw - 32px); }
  .status button { border: 0; background: var(--new); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 600; }
  .status button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--new); }

  /* ---- bottom toolbar ---- */
  .bar { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
         padding: 6px 8px calc(var(--sab) + 6px); background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(14px);
         backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .bar button { position: relative; flex: 1; max-width: 110px; border: 0; background: none; display: flex; flex-direction: column; align-items: center;
                gap: 2px; padding: 4px 0; font-size: 11px; color: var(--muted); min-height: 44px; }
  .bar button svg { width: 24px; height: 24px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar button.busy svg { animation: spin 1s linear infinite; }
  .bar button[data-n]:not([data-n="0"])::after { content: attr(data-n); position: absolute; top: 0; left: calc(50% + 8px); background: var(--blue);
                color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .leaflet-bottom { bottom: calc(var(--sab) + 62px); }
  .leaflet-top { top: calc(var(--sat) + 52px); }
  @media (pointer: coarse) { .leaflet-control-zoom { display: none; } }
  .leaflet-control-attribution { font-size: 10px; }
  .osm-muted { filter: grayscale(1) brightness(1.08) contrast(.8); }

  /* ---- bottom sheets ---- */
  .scrim { position: fixed; inset: 0; z-index: 1090; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 82vh; background: #fff; border-radius: 14px 14px 0 0;
           box-shadow: 0 -2px 16px rgba(0,0,0,.2); display: flex; flex-direction: column; transform: translateY(105%);
           transition: transform .25s ease; padding-bottom: var(--sab); }
  .sheet.open { transform: none; }
  @media (min-width: 700px) { .sheet { left: auto; right: 12px; bottom: 12px; width: 380px; border-radius: 14px; } }
  .sheet header { padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet header::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: #d1d1d6; margin: 0 auto 8px; }
  .sheet .title { display: flex; align-items: center; font-weight: 600; font-size: 17px; }
  .sheet .title button { margin-left: auto; border: 0; background: none; color: var(--blue); font-size: 17px; font-weight: 600; padding: 6px 0 6px 12px; }
  .sheet .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 16px; }

  .tog { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .tog input { width: 22px; height: 22px; accent-color: var(--blue); margin: 0; }
  .tog .grow { flex: 1; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; }
  .seg { display: flex; background: #eeeef0; border-radius: 9px; padding: 2px; margin: 12px 0 4px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 7px 0; font-size: 14px; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
  .links { display: flex; gap: 8px; margin: 14px 0 6px; }
  .links a, .links button, .pbtn { flex: 1; text-align: center; border: 1px solid var(--line); background: #f7f7f9; border-radius: 10px;
            padding: 10px 6px; font-size: 15px; color: var(--blue); text-decoration: none; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .legend .sw { width: 10px; height: 10px; margin-right: 1px; }

  .li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .li small { color: var(--muted); display: block; margin: 2px 0 4px; }
  .li .dist { float: right; color: var(--muted); font-size: 13px; }
  .item { display: flex; gap: 10px; align-items: center; min-height: 40px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .item input { width: 20px; height: 20px; margin: 0; accent-color: var(--blue); }
  .item .n { color: var(--muted); margin-left: auto; font-size: 13px; }
  .star { border: 0; background: none; font-size: 22px; padding: 0 2px; color: #f5b400; min-width: 32px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: #f7f7f9; border-radius: 999px; padding: 5px 11px; font-size: 14px; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  #sp-search { width: 100%; box-sizing: border-box; margin: 10px 0 8px; padding: 8px 12px; border: 0; border-radius: 10px; background: #eeeef0; }

  /* ---- map markers ---- */
  .dot span { display: block; width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%;
              border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .dot.st span { border: 3px solid #f5b400; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .dot.nw::before, .clu.nw::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--new);
              animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .clu div { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; color: #fff; font: 600 13px -apple-system, system-ui, sans-serif;
             display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,.85);
             box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .clu.st div { border-color: #f5b400; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #0a84ff; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 0 8px rgba(10,132,255,.6); box-sizing: border-box; }

  /* ---- popups ---- */
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; line-height: 1.4; }
  .pop img { width: 100%; height: 130px; object-fit: cover; background: #eee; border-radius: 8px; margin-bottom: 4px; display: block; }
  .pop h3 { margin: 4px 0; font-size: 17px; }
  .pop small { color: var(--muted); }
  .pop .acts { display: flex; gap: 6px; margin-top: 8px; }
  .pop .acts a, .pop .acts button { flex: 1; text-align: center; border: 1px solid var(--line); background: #f7f7f9; border-radius: 8px;
            padding: 7px 2px; font-size: 13px; color: var(--blue); text-decoration: none; }
  .pill { display: inline-block; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 0 4px 4px 0; }
</style>
</head>
<body>
<div id="map"></div>

<div class="status"><span id="updated">Loading&hellip;</span><button id="new-btn" hidden></button></div>

<nav class="bar">
  <button id="open-filters"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Filters</span></button>
  <button id="open-list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>List</span></button>
  <button id="locate"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5"/></svg><span>Near me</span></button>
  <button id="refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span id="refresh-label">Refresh</span></button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="filters-sheet">
  <header><div class="title">Filters<button class="close">Done</button></div></header>
  <div class="body">
    <label class="tog"><input type="checkbox" id="f-needs" checked><span class="grow"><span class="sw" style="background:var(--blue)"></span> Needs</span></label>
    <label class="tog"><input type="checkbox" id="f-rare" checked><span class="grow"><span class="sw" style="background:var(--red)"></span> Rare</span></label>
    <label class="tog"><input type="checkbox" id="f-nearby" checked><span class="grow">Nearby counties (rare)</span></label>
    <label class="tog"><input type="checkbox" id="f-new"><span class="grow">New since last visit only</span></label>
    <label class="tog"><input type="checkbox" id="f-star"><span class="grow">&#9733; Starred only</span></label>
    <label class="tog"><input type="checkbox" id="f-gone"><span class="grow">Hide &ldquo;probably gone&rdquo;</span></label>
    <div class="seg" id="days"><button data-v="1">Today</button><button data-v="3">3 days</button><button data-v="7" class="on">7 days</button></div>
    <div class="links"><button id="open-species">Species&hellip; (<span id="hidden-count">0</span> hidden)</button><a href="archive.html">Archive</a></div>
    <div class="legend" id="legend"></div>
  </div>
</section>

<section class="sheet" id="list-sheet">
  <header>
    <div class="title">Birds on the map<button class="close">Done</button></div>
    <div class="row" id="sort" style="margin-top:8px">
      <button class="chip on" data-v="staying">Staying first</button><button class="chip" data-v="new">Newest</button>
      <button class="chip" data-v="near">Nearest</button><button class="chip" data-v="az">A&ndash;Z</button>
    </div>
  </header>
  <div class="body" id="list"></div>
</section>

<section class="sheet" id="sp-sheet">
  <header>
    <div class="title">Species<button class="close">Done</button></div>
    <input type="search" id="sp-search" placeholder="Search species">
    <div class="row">
      <button class="chip" id="show-all">Show all</button><button class="chip" id="hide-all">Hide all</button>
      <button class="chip" id="only-seen">On map</button><button class="chip" id="only-star">&#9733; Starred</button>
    </div>
    <small style="color:var(--muted);display:block;margin-top:6px">Unchecked = hidden. &#9733; = target bird. Saved on this device.</small>
  </header>
  <div class="body" id="sp-list"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SF = [[37.70, -122.52], [37.82, -122.35]], BAY = [[37.2, -122.65], [38.05, -121.75]];
const map = L.map('map', { zoomSnap: 0.5, tap: false }).fitBounds(SF);
// Muted basemap so the bird dots stand out (no API key needed): Esri's light grey canvas plus its label layer.
// If those tiles ever stop loading, fall back to OpenStreetMap, toned down to grey with CSS.
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
const base = L.layerGroup([
  L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 16,
    attribution: 'Tiles &copy; <a href="https://www.esri.com">Esri</a>, HERE, Garmin, &copy; OpenStreetMap contributors' }),
  L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 16 }),
]).addTo(map);
let tilesOk = 0, tileErrs = 0;
base.eachLayer(l => l.on('tileload', () => tilesOk++).on('tileerror', () => {
  if (++tileErrs < 4 || tilesOk || !map.hasLayer(base)) return;
  map.removeLayer(base);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'osm-muted',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
}));
map.attributionControl.setPrefix(false);
// Nearby birds merge into one numbered bubble when zoomed out; birds at the same spot fan out when tapped.
const layer = L.markerClusterGroup({
  maxClusterRadius: 40, showCoverageOnHover: false, spiderfyDistanceMultiplier: 1.8,
  iconCreateFunction: c => {
    const kids = c.getAllChildMarkers(), n = kids.length;
    const needs = kids.some(m => m.options.needs), star = kids.some(m => m.options.star), nw = kids.some(m => m.options.isNew);
    const size = n < 10 ? 32 : n < 50 ? 40 : 48;
    return L.divIcon({ html: `<div style="background:${needs ? 'var(--blue)' : 'var(--red)'}">${n}</div>`, // blue if any bird you still need
      className: 'clu' + (star ? ' st' : '') + (nw ? ' nw' : ''), iconSize: [size, size] });
  } }).addTo(map);
let sightings = [], allSpecies = [], markers = {}, days = 7, sortMode = 'staying', me = null, meMarker = null;

// ----- saved on this device -----
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
                del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const loadSet = k => { try { return new Set(JSON.parse(store.get(k) || '[]')); } catch (e) { return new Set(); } };
const hidden = loadSet('hiddenSpecies'), starred = loadSet('starredSpecies');
function save() {
  store.set('hiddenSpecies', JSON.stringify([...hidden])); store.set('starredSpecies', JSON.stringify([...starred]));
  $('hidden-count').textContent = hidden.size;
}
function toggleStar(code) { starred.has(code) ? starred.delete(code) : (starred.add(code), hidden.delete(code)); save(); refresh(); }
function hideSpecies(code) { hidden.add(code); starred.delete(code); save(); refresh(); }

// ----- "new since last visit" -----
// Opening the map again within 2 hours counts as the same visit, so new birds don't vanish on a quick re-open.
const now = Date.now(), lastOpen = +store.get('visitLast') || 0;
if (lastOpen && now - lastOpen > 2 * 36e5) store.set('visitPrev', lastOpen);
store.set('visitLast', now);
const since = +store.get('visitPrev') || 0;
const isNew = s => !!(since && s.added && Date.parse(s.added) > since);

// ----- colors fade with age -----
const NEEDS = ['#0a3a8c', '#1e6fd9', '#4a8fe0', '#76a9ea', '#9fc2f0', '#c0d7f5', '#d9e6f8'];
const RARE  = ['#8f1a12', '#d93025', '#e5594f', '#ec817a', '#f2a6a1', '#f6c4c0', '#f9dad8'];
const STATUS = { staying: '#1a7f37', new: '#6f42c1', maybe: '#b7791f', gone: '#777' };
function ageDays(dateStr) {
  const t = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }).split('-').map(Number);
  const o = dateStr.slice(0, 10).split('-').map(Number);
  return Math.round((Date.UTC(t[0], t[1] - 1, t[2]) - Date.UTC(o[0], o[1] - 1, o[2])) / 864e5);
}
function statusText(s) {
  const last = new Date(s.dates[s.dates.length - 1] + 'T12:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
  if (s.status === 'staying') return `Staying: ${s.streak} day${s.streak > 1 ? 's' : ''} running`;
  if (s.status === 'new') return 'New today';
  if (s.status === 'maybe') return `Seen ${s.days_reported} day${s.days_reported > 1 ? 's' : ''}, not yet today`;
  return `Probably gone, last ${last}`;
}
const pill = s => `<span class="pill" style="background:${STATUS[s.status]}">${esc(statusText(s))}</span>`
  + (isNew(s) ? '<span class="pill" style="background:var(--new)">New since last visit</span>' : '');
$('legend').innerHTML = [[NEEDS, 'Needs'], [RARE, 'Rare']].map(([c, l]) =>
  `<div>${c.map(x => `<span class="sw" style="background:${x}"></span>`).join('')} ${l}</div>`).join('')
  + '<div>Dark = today, light = older. Purple ring = new since your last visit.</div>';

// ----- distance (for "Nearest") -----
function km(a, b) {
  const r = Math.PI / 180, x = (b.lng - a.lng) * r * Math.cos((a.lat + b.lat) * r / 2), y = (b.lat - a.lat) * r;
  return Math.sqrt(x * x + y * y) * 6371;
}
const distText = s => me ? (d => d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(d < 10 ? 1 : 0)} km`)(km(me, s)) : '';

function popup(s) {
  const p = s.photo;
  const photo = p ? `<a href="${esc(p.page)}" target="_blank"><img src="${esc(p.file)}" alt="" onerror="this.style.display='none'"></a>
    <small>${p.generic ? 'Generic photo' : 'Photo from this checklist'} &middot; ${esc(p.credit)}</small>` : '';
  const when = new Date(s.datetime.replace(' ', 'T')).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const days = s.dates.map(d => new Date(d + 'T12:00').toLocaleDateString([], { month: 'short', day: 'numeric' })).join(', ');
  const d = distText(s);
  return `<div class="pop">${photo}<h3>${starred.has(s.code) ? '&#9733; ' : ''}${esc(s.species)}</h3>
    ${pill(s)}<span class="pill" style="background:${s.confirmed ? '#1a7f37' : '#888'}">${s.confirmed ? '&#10003; Confirmed' : 'Unconfirmed'}</span><br>
    <b>${esc(s.location)}</b>${s.county !== 'San Francisco' ? ` (${esc(s.county)} Co.)` : ''}${s.approximate ? ' <small>(approximate)</small>' : ''}${d ? ` &middot; ${d} away` : ''}<br>
    Last: ${esc(when)} &middot; ${esc(s.observer)}${s.count ? ` &middot; &times;${esc(s.count)}` : ''}<br>
    <small>Reported ${esc(days)} (${s.reports} checklist${s.reports > 1 ? 's' : ''})</small>
    <div class="acts"><a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank">Directions</a>
    <a href="https://ebird.org/checklist/${esc(s.checklist)}" target="_blank">Checklist</a>
    <button data-act="star" data-code="${esc(s.code)}">${starred.has(s.code) ? '&#9733; Unstar' : '&#9734; Star'}</button>
    <button data-act="hide" data-code="${esc(s.code)}">Hide</button></div></div>`;
}
map.on('popupopen', e => e.popup.getElement().querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
  map.closePopup(); b.dataset.act === 'star' ? toggleStar(b.dataset.code) : hideSpecies(b.dataset.code);
}));

function visible() {
  const needs = $('f-needs').checked, rare = $('f-rare').checked, nearby = $('f-nearby').checked;
  return sightings.filter(s => {
    if (hidden.has(s.code)) return false;
    if ($('f-star').checked && !starred.has(s.code)) return false;
    if ($('f-new').checked && !isNew(s)) return false;
    if ($('f-gone').checked && s.status === 'gone') return false;
    const n = s.alerts.includes('needs'), r = s.alerts.includes('rare');
    if (!((n && needs) || (r && rare) || (!n && !r))) return false;
    if (s.county !== 'San Francisco' && !nearby) return false;
    return ageDays(s.datetime) <= days - 1;
  });
}

function render() {
  layer.clearLayers(); markers = {};
  const vis = visible();
  vis.forEach(s => {
    const age = Math.max(0, Math.min(6, ageDays(s.datetime)));
    const cols = s.alerts.includes('rare') ? RARE : NEEDS, st = starred.has(s.code), nw = isNew(s), size = st ? 24 : 18;
    markers[s.id] = L.marker([s.lat, s.lng], { needs: s.alerts.includes('needs'), star: st, isNew: nw,
      zIndexOffset: (st ? 2000 : 0) + (nw ? 1000 : 0) + (6 - age) * 10,
      icon: L.divIcon({ className: 'dot' + (st ? ' st' : '') + (nw ? ' nw' : ''), iconSize: [size, size],
                        html: `<span style="background:${cols[age]}"></span>` }) })
      .bindPopup(() => popup(s), { maxWidth: 280, minWidth: 240, maxHeight: Math.round(innerHeight * 0.65), autoPanPaddingTopLeft: [10, 70], autoPanPaddingBottomRight: [10, 90] });
  });
  layer.addLayers(Object.values(markers));
  $('open-list').dataset.n = vis.length;
  const off = ['f-needs', 'f-rare', 'f-nearby'].filter(id => !$(id).checked).length
    + ['f-new', 'f-star', 'f-gone'].filter(id => $(id).checked).length + (days !== 7) + (hidden.size > 0);
  $('open-filters').dataset.n = off;
  const n = sightings.filter(isNew).length;
  $('new-btn').hidden = !n; $('new-btn').textContent = `${n} new`; $('new-btn').classList.toggle('on', $('f-new').checked);
  renderList();
}

function renderList() {
  const order = { staying: 0, new: 1, maybe: 2, gone: 3 };
  const rows = visible().sort((a, b) =>
    sortMode === 'az' ? a.species.localeCompare(b.species)
    : sortMode === 'near' && me ? km(me, a) - km(me, b)
    : sortMode === 'staying' ? (order[a.status] - order[b.status]) || b.datetime.localeCompare(a.datetime)
    : b.datetime.localeCompare(a.datetime));
  $('list').innerHTML = rows.map(s => `<div class="li" data-id="${esc(s.id)}"><span class="dist">${distText(s)}</span>
    ${starred.has(s.code) ? '&#9733; ' : ''}<b>${esc(s.species)}</b> ${s.confirmed ? '&#10003;' : ''}
    <small>${esc(s.location)} &middot; ${esc(s.county)}</small>${pill(s)}</div>`).join('') || '<p>Nothing matches the filters.</p>';
  $('list').querySelectorAll('.li').forEach(el => el.onclick = () => {
    const m = markers[el.dataset.id]; if (!m) return;
    closeSheets(); layer.zoomToShowLayer(m, () => m.openPopup());
  });
}

const chip = id => $(id).classList.contains('on');
function buildSpecies() {
  const q = $('sp-search').value.toLowerCase(), seen = {};
  sightings.forEach(s => seen[s.code] = (seen[s.code] || 0) + 1);
  $('sp-list').innerHTML = '';
  allSpecies.forEach(sp => {
    if (q && !(sp.name.toLowerCase().includes(q) || (sp.sci || '').toLowerCase().includes(q))) return;
    if (chip('only-seen') && !seen[sp.code]) return;
    if (chip('only-star') && !starred.has(sp.code)) return;
    const row = document.createElement('label'); row.className = 'item';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !hidden.has(sp.code);
    cb.onchange = () => { cb.checked ? hidden.delete(sp.code) : (hidden.add(sp.code), starred.delete(sp.code)); save(); render(); };
    const st = document.createElement('button'); st.className = 'star'; st.textContent = starred.has(sp.code) ? '★' : '☆';
    st.onclick = e => { e.preventDefault(); toggleStar(sp.code); };
    row.append(cb, document.createTextNode(sp.name));
    if (seen[sp.code]) { const n = document.createElement('span'); n.className = 'n'; n.textContent = seen[sp.code]; row.append(n); }
    row.append(st);
    $('sp-list').append(row);
  });
}
function refresh() { render(); if ($('sp-sheet').classList.contains('open')) buildSpecies(); }

// ----- sheets -----
function openSheet(id) { closeSheets(); $(id).classList.add('open'); $('scrim').classList.add('open'); }
function closeSheets() { document.querySelectorAll('.sheet.open, .scrim.open').forEach(d => d.classList.remove('open')); }
document.querySelectorAll('.sheet .close').forEach(b => b.onclick = closeSheets);
$('scrim').onclick = closeSheets;
$('open-filters').onclick = () => openSheet('filters-sheet');
$('open-list').onclick = () => { renderList(); openSheet('list-sheet'); };
$('open-species').onclick = () => { buildSpecies(); openSheet('sp-sheet'); };
$('sp-search').addEventListener('input', buildSpecies);
['only-seen', 'only-star'].forEach(id => $(id).onclick = () => { $(id).classList.toggle('on'); buildSpecies(); });
$('sort').onclick = e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  sortMode = v; $('sort').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v === v));
  if (v === 'near' && !me) locate(false); else renderList();
};
$('days').onclick = e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  days = +v; $('days').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target)); render();
};
$('show-all').onclick = () => { hidden.clear(); save(); refresh(); };
$('hide-all').onclick = () => { allSpecies.forEach(s => hidden.add(s.code)); starred.clear(); save(); refresh(); };
['f-needs', 'f-rare', 'f-star', 'f-gone', 'f-new'].forEach(id => $(id).addEventListener('change', render));
$('f-nearby').addEventListener('change', e => { render(); map.fitBounds(e.target.checked ? BAY : SF); });
$('new-btn').onclick = () => { $('f-new').checked = !$('f-new').checked; render(); };

// ----- Near me -----
function locate(fly = true) {
  $('locate').classList.add('busy');
  map.locate({ enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  map.once('locationfound', e => {
    $('locate').classList.remove('busy');
    me = { lat: e.latlng.lat, lng: e.latlng.lng };
    if (meMarker) meMarker.setLatLng(e.latlng);
    else meMarker = L.marker(e.latlng, { interactive: false, zIndexOffset: 5000,
      icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }) }).addTo(map);
    if (fly) map.flyTo(e.latlng, Math.max(map.getZoom(), 14), { duration: 0.6 });
    renderList();
  });
  map.once('locationerror', () => {
    $('locate').classList.remove('busy');
    alert('Couldn’t get your location. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using.');
  });
}
$('locate').onclick = () => locate(true);

// ----- data -----
let baseSpecies = [];
function applyData(j) {
  sightings = j.sightings; allSpecies = baseSpecies.slice();
  const have = new Set(allSpecies.map(s => s.code));
  sightings.forEach(s => { if (!have.has(s.code)) { have.add(s.code); allSpecies.push({ code: s.code, name: s.species, sci: s.sci }); } });
  if (j.generated) {
    $('updated').textContent = 'Updated ' + new Date(j.generated).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    $('updated').dataset.gen = j.generated;
  }
  save(); render();
}
Promise.all([fetch('sightings.json').then(r => r.json()), fetch('species.json').then(r => r.json()).catch(() => [])])
  .then(([j, species]) => { baseSpecies = species; applyData(j); })
  .catch(() => { $('updated').textContent = 'Couldn’t load sightings'; });

// ----- Refresh: asks GitHub to run the update right away -----
async function refreshNow() {
  const btn = $('refresh'), lab = $('refresh-label');
  if (btn.classList.contains('busy')) return;
  const done = (msg, ms = 3000) => { btn.classList.remove('busy'); lab.textContent = msg; setTimeout(() => { lab.textContent = 'Refresh'; }, ms); };
  let repo = (location.hostname.endsWith('.github.io') && location.pathname.split('/')[1])
    ? `${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}` : store.get('ghRepo');
  if (!repo) { repo = (prompt('Your GitHub repo, like username/sf-bird-map:') || '').trim(); if (!repo) return; store.set('ghRepo', repo); }
  let token = store.get('ghToken');
  if (!token) { token = (prompt('Paste your GitHub token (one time on this device):') || '').trim(); if (!token) return; store.set('ghToken', token); }
  btn.classList.add('busy'); lab.textContent = 'Starting';
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/update.yml/dispatches`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ ref: 'main' }) });
    if ([401, 403, 404].includes(r.status)) { store.del('ghToken'); alert('GitHub rejected the token (expired, or missing Actions permission). Tap Refresh to enter a new one.'); return done('Refresh', 0); }
    if (r.status !== 204) throw new Error('GitHub said HTTP ' + r.status);
    lab.textContent = 'Updating';
    const before = $('updated').dataset.gen;
    for (let i = 0; i < 30; i++) {
      await new Promise(res => setTimeout(res, 10000));
      const j = await fetch('sightings.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => null);
      if (j && j.generated !== before) { applyData(j); return done('Updated ✓'); }
    }
    done('Still running', 5000);
  } catch (e) { alert('Refresh failed: ' + e.message); done('Refresh', 0); }
}
$('refresh').onclick = refreshNow;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
