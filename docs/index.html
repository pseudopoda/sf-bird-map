<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Bird Alerts Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .panel { position: absolute; z-index: 1000; top: 10px; right: 10px; background: #fff;
           padding: 10px 12px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 14px; max-width: 220px; }
  .panel label { display: block; margin: 3px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  button { cursor: pointer; font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #bbb; background: #f6f6f6; }
  .pop img { width: 100%; border-radius: 6px; margin-bottom: 6px; }
  .pop h3 { margin: 0 0 4px; }
  .pop small { color: #555; }
  #drawer { position: absolute; z-index: 1100; top: 0; left: 0; bottom: 0; width: min(340px, 90vw); background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,.3); display: none; flex-direction: column; }
  #drawer.open { display: flex; }
  #drawer header { padding: 10px; border-bottom: 1px solid #ddd; }
  #drawer header input[type=search] { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; }
  #sp-list { overflow-y: auto; flex: 1; padding: 6px 10px; }
  #sp-list label { display: flex; gap: 6px; margin: 2px 0; font-size: 14px; }
  #sp-list .n { color: #888; margin-left: auto; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <strong>SF Bird Alerts</strong>
  <label><input type="checkbox" id="f-needs" checked><span class="dot" style="background:#1e6fd9"></span>Needs</label>
  <label><input type="checkbox" id="f-rare" checked><span class="dot" style="background:#d93025"></span>Rare</label>
  <label>Show last
    <select id="days"><option value="1">1 day</option><option value="3">3 days</option>
    <option value="7" selected>7 days</option><option value="30">30 days</option><option value="9999">all</option></select>
  </label>
  <button id="open-species">Species (<span id="hidden-count">0</span> hidden)</button><br>
  <small id="updated"></small>
</div>

<div id="drawer">
  <header>
    <div class="row"><strong>Species</strong><button id="close-species" style="margin-left:auto">Done</button></div>
    <input type="search" id="sp-search" placeholder="Search species...">
    <div class="row">
      <button id="show-all">Show all</button>
      <button id="hide-all">Hide all</button>
      <label><input type="checkbox" id="only-seen"> only with sightings</label>
    </div>
    <small>Unchecked species are hidden from the map. Saved on this device.</small>
  </header>
  <div id="sp-list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').fitBounds([[37.64, -123.03], [37.84, -122.33]]);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

const layer = L.layerGroup().addTo(map);
let sightings = [], allSpecies = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ----- hidden species, remembered in this browser -----
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem('hiddenSpecies') || '[]')); } catch (e) {}
function saveHidden() {
  try { localStorage.setItem('hiddenSpecies', JSON.stringify([...hidden])); } catch (e) {}
  document.getElementById('hidden-count').textContent = hidden.size;
}

function popup(s) {
  let photo = '';
  if (s.photo) {
    photo = `<a href="${esc(s.photo.page)}" target="_blank"><img src="${esc(s.photo.url)}" alt="${esc(s.species)}"></a>
      <small>${s.photo.generic ? 'Generic species photo' : 'Photo from this checklist'} &middot; &copy; ${esc(s.photo.credit)} / Macaulay Library</small><br>`;
  }
  const when = new Date(s.datetime.replace(' ', 'T')).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
  return `<div class="pop">${photo}<h3>${esc(s.species)}</h3>
    <em>${esc(s.sci)}</em><br>
    <b>Where:</b> ${esc(s.location)}${s.approximate ? ' <small>(approximate location)</small>' : ''}<br>
    <b>When:</b> ${esc(when)}<br>
    <b>Observer:</b> ${esc(s.observer)}<br>
    ${s.count ? `<b>Count:</b> ${esc(s.count)}<br>` : ''}
    <a href="https://ebird.org/checklist/${esc(s.checklist)}" target="_blank">View checklist</a><br>
    <button class="hide-btn" data-code="${esc(s.code)}" style="margin-top:6px">Hide this species</button></div>`;
}

map.on('popupopen', e => {
  const b = e.popup.getElement().querySelector('.hide-btn');
  if (b) b.onclick = () => { hidden.add(b.dataset.code); saveHidden(); map.closePopup(); render(); buildList(); };
});

function render() {
  layer.clearLayers();
  const showNeeds = document.getElementById('f-needs').checked;
  const showRare = document.getElementById('f-rare').checked;
  const cutoff = Date.now() - document.getElementById('days').value * 86400000;
  sightings.forEach(s => {
    if (hidden.has(s.code)) return;
    const isNeeds = s.alerts.includes('needs'), isRare = s.alerts.includes('rare');
    if (!((isNeeds && showNeeds) || (isRare && showRare) || (!isNeeds && !isRare))) return;
    if (new Date(s.datetime.replace(' ', 'T')).getTime() < cutoff) return;
    L.circleMarker([s.lat, s.lng], { radius: 9, color: '#fff', weight: 2,
      fillColor: isRare ? '#d93025' : '#1e6fd9', fillOpacity: .9 })
      .bindPopup(popup(s), { maxWidth: 260 }).addTo(layer);
  });
}

// ----- species picker -----
function buildList() {
  const q = document.getElementById('sp-search').value.toLowerCase();
  const onlySeen = document.getElementById('only-seen').checked;
  const counts = {};
  sightings.forEach(s => counts[s.code] = (counts[s.code] || 0) + 1);
  const list = document.getElementById('sp-list');
  list.innerHTML = '';
  allSpecies.forEach(sp => {
    if (q && !(sp.name.toLowerCase().includes(q) || (sp.sci || '').toLowerCase().includes(q))) return;
    if (onlySeen && !counts[sp.code]) return;
    const l = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !hidden.has(sp.code);
    cb.onchange = () => { cb.checked ? hidden.delete(sp.code) : hidden.add(sp.code); saveHidden(); render(); };
    l.append(cb, document.createTextNode(sp.name));
    if (counts[sp.code]) { const n = document.createElement('span'); n.className = 'n'; n.textContent = counts[sp.code]; l.append(n); }
    list.append(l);
  });
}

document.getElementById('open-species').onclick = () => { document.getElementById('drawer').classList.add('open'); buildList(); };
document.getElementById('close-species').onclick = () => document.getElementById('drawer').classList.remove('open');
document.getElementById('sp-search').oninput = buildList;
document.getElementById('only-seen').onchange = buildList;
document.getElementById('show-all').onclick = () => { hidden.clear(); saveHidden(); render(); buildList(); };
document.getElementById('hide-all').onclick = () => { allSpecies.forEach(s => hidden.add(s.code)); saveHidden(); render(); buildList(); };
['f-needs', 'f-rare', 'days'].forEach(id => document.getElementById(id).addEventListener('change', render));

Promise.all([
  fetch('sightings.json').then(r => r.json()),
  fetch('species.json').then(r => r.json()).catch(() => [])
]).then(([j, species]) => {
  sightings = j.sightings;
  allSpecies = species.slice();
  // make sure any alerted species missing from the county list still appears
  const have = new Set(allSpecies.map(s => s.code));
  sightings.forEach(s => { if (!have.has(s.code)) { have.add(s.code); allSpecies.push({code: s.code, name: s.species, sci: s.sci}); } });
  if (j.generated) document.getElementById('updated').textContent = 'Updated ' + new Date(j.generated).toLocaleString();
  saveHidden(); render();
});
</script>
</body>
</html>
